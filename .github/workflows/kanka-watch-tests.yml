name: Kanka watch tests

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/kanka-upgrade-issue.md'
      - '.github/upstream-audit-accepted.txt'
      - '.github/workflows/kanka-*.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/kanka-upgrade-issue.md'
      - '.github/upstream-audit-accepted.txt'
      - '.github/workflows/kanka-*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck .github/scripts/*.sh
      - run: .github/scripts/test-kanka-watch.sh
