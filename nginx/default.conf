# The only server block in the image: every path is gated by oauth2-proxy except the exact
# locations marked `auth_request off`. New locations are gated by default (server-level auth_request).
# /_info shares the small PHP-FPM pool and is public: cap it (monitoring polls about once a minute).
limit_req_zone $server_name zone=info:1m rate=2r/s;

server {
	listen 8080 default_server;
	listen [::]:8080 default_server;
	server_name _;
	root /var/www/html/public;
	absolute_redirect off;
	charset utf-8;

	# Re-resolved every 30s, so a recreated sidecar container doesn't strand this nginx on a stale IP.
	resolver 127.0.0.11 valid=30s;
	resolver_timeout 2s;
	set $oauth2proxy http://lucos_campaigns_auth:4180;

	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	auth_request /oauth2/auth;
	auth_request_set $auth_cookie $upstream_http_set_cookie;
	add_header Set-Cookie $auth_cookie;
	error_page 401 = /oauth2/start;

	location = /oauth2/auth {
		internal;
		auth_request off;
		proxy_pass $oauth2proxy;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_set_header X-Forwarded-Uri $request_uri;
		proxy_set_header Content-Length "";
		proxy_pass_request_body off;
	}

	# Login/callback/sign-out: proxied to the sidecar only, never to Laravel.
	location /oauth2/ {
		auth_request off;
		proxy_pass $oauth2proxy;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_set_header X-Auth-Request-Redirect $request_uri;
	}

	# Monitoring (#4). Fixed script, so a missing file can't fall through to Laravel.
	location = /_info {
		auth_request off;
		limit_req zone=info burst=5 nodelay;
		limit_req_status 429;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root/_info.php;
		fastcgi_pass 127.0.0.1:9000;
	}

	location = /favicon.ico {
		auth_request off;
		try_files $uri =404;
	}

	location / {
		try_files $uri /index.php?$query_string;
	}

	location = /index.php {
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root/index.php;
		fastcgi_pass 127.0.0.1:9000;
		fastcgi_read_timeout 300s;
	}

	# Only index.php runs PHP; uploaded .php files are never executed.
	location ~ \.php$ {
		return 404;
	}

	location ~ /\.(?!well-known) {
		deny all;
	}
}
