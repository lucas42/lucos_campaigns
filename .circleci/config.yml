version: 2.1
orbs:
  lucos: lucos/deploy@0
jobs:
  test-gate:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Run auth gate smoke test
          # Real nginx gate config + real oauth2-proxy in front of a stub app: unauthenticated
          # requests must redirect (never 200), and a dead sidecar must fail closed. Uses
          # build-and-run.sh, not bind mounts: the remote Docker daemon can't see checked-out files.
          command: test/gate/build-and-run.sh
workflows:
  version: 2
  build-deploy:
    jobs:
      - test-gate
      - lucos/build:
          serial-group: << pipeline.project.slug >>/build/<< pipeline.git.branch >>
      - lucos/deploy-avalon:
          serial-group: deploy-avalon
          requires:
            - test-gate
            - lucos/build
          filters:
            branches:
              only:
                - main
